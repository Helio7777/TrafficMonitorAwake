name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem build -Recurse -Filter TrafficMonitorAwake.dll | Select-Object -First 1
          if (-not $dll) { throw 'TrafficMonitorAwake.dll not found' }
          Copy-Item $dll.FullName artifact/TrafficMonitorAwake.dll
          Copy-Item README.md, LICENSE artifact/
          Compress-Archive -Path artifact/* -DestinationPath "TrafficMonitorAwake-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitorAwake-${{ matrix.arch }}
          path: TrafficMonitorAwake-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: TrafficMonitorAwake-*
          path: release-assets
          merge-multiple: true
      - name: Validate release packages
        shell: bash
        run: |
          test -f release-assets/TrafficMonitorAwake-x64.zip
          test -f release-assets/TrafficMonitorAwake-Win32.zip
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;

            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `TrafficMonitor Awake ${tag}`,
                generate_release_notes: true,
                draft: true,
                prerelease: false,
              })).data;
            }

            const packageNames = fs.readdirSync('release-assets')
              .filter((name) => name.endsWith('.zip'))
              .sort();
            const uploaded = new Set((release.assets || []).map((asset) => asset.name));

            for (const name of packageNames) {
              if (uploaded.has(name)) continue;
              const file = path.join('release-assets', name);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': fs.statSync(file).size,
                },
                data: fs.readFileSync(file),
              });
            }

            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
            }
